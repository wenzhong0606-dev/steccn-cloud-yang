<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保养任务 · 设备管理</title><link rel="stylesheet" href="../shared/style.css?v=20261011-5"></head><body data-page="maintenance-task"><div id="platform-header"></div><div class="shell"><aside id="module-nav"></aside><main><div class="breadcrumb" id="breadcrumb"></div><div class="title work-heading"><div><h1 id="mt-title">保养任务详情</h1><p class="text-secondary small">计划窗口 · 个人派工 · 执行送验收</p></div></div><p id="mt-load" role="status">正在读取任务…</p><section class="card mb-3"><div class="d-flex align-items-center justify-content-between gap-2 mb-3"><h2 class="business-panel-title">任务与计划快照</h2><span id="mt-state" class="badge text-bg-secondary"></span></div><dl id="mt-summary" class="row small mb-2"></dl><div id="mt-actions" class="d-flex flex-wrap gap-2"></div><p id="mt-boundary" class="small text-secondary mt-2 mb-0"></p></section>
<section class="card mb-3"><div class="list-panel-header"><h2 class="business-panel-title">当前安全检查</h2><button id="mt-safety-refresh" class="btn btn-outline-secondary btn-sm">复核条件</button></div><div id="mt-safety" class="row g-2"></div><p id="mt-permit" class="small text-secondary mt-2 mb-0"></p></section>
<form id="mt-execution-form"><fieldset id="mt-execution-fields" disabled><section class="card mb-3"><h2 class="business-panel-title mb-3">逐项执行记录</h2><div id="mt-items" class="d-flex flex-column gap-3"></div></section><section class="card mb-3"><h2 class="business-panel-title mb-3">完工记录</h2><div class="row g-3"><label class="col-md-4 field">工时（分钟）<input id="mt-labor" type="number" min="0" class="form-control"></label><label class="col-md-8 field">用料单引用<input id="mt-material" class="form-control" maxlength="200" placeholder="如领料单编号；无用料可留空"></label><label class="col-12 field">试运行结论 *<textarea id="mt-trial" class="form-control" maxlength="2000" placeholder="记录恢复防护后的试运行结果"></textarea></label></div></section></fieldset><p id="mt-error" role="alert" class="text-danger"></p><button id="mt-save" class="btn btn-primary btn-sm mb-3" hidden>暂存执行记录</button></form>
<section class="card mb-3"><div class="list-panel-header"><h2 class="business-panel-title">关联异常</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>项目</th><th>发现编号</th><th>关联状态</th><th>反馈</th><th>操作</th></tr></thead><tbody id="mt-links"></tbody></table></div><div id="mt-links-pagination" class="list-pagination"></div></section>
<section class="card mb-3"><div class="list-panel-header"><h2 class="business-panel-title">执行与审核版本记录</h2><div class="list-panel-tools"><div class="input-group input-group-sm" data-component="filter-bar"><input id="mc-history-search" class="form-control" aria-label="搜索版本记录" placeholder="版本、类型或审核意见"></div></div></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>业务类型</th><th>执行版本</th><th>决定 / 状态</th><th>人员</th><th>时间</th><th>意见</th><th>操作</th></tr></thead><tbody id="mc-history"></tbody></table></div><div id="mc-history-pagination" class="list-pagination"></div></section><section class="card mb-3"><h2 class="business-panel-title mb-3">派工与操作审计</h2><div class="table-wrapper"><table class="data-table"><thead><tr><th>时间</th><th>人员</th><th>操作</th><th>原因</th></tr></thead><tbody id="mt-audit"></tbody></table></div><div id="mt-audit-pagination" class="list-pagination"></div></section>
<template id="mt-item-template"><div class="border rounded p-3"><h3 class="h6" data-item-name></h3><p class="small text-secondary" data-item-standard></p><div class="row g-2"><label class="col-md-4 field">执行结论<select data-field="conclusion" class="form-select"><option value="">未记录</option><option value="normal">正常 / 完成</option><option value="abnormal">异常</option></select></label><label class="col-md-4 field" data-number-label>实测值<input data-field="value" type="number" step="any" class="form-control"></label><label class="col-md-4 field">证据引用<input data-field="evidence" class="form-control" maxlength="1000" placeholder="照片、文档或记录编号"></label><label class="col-12 field">遗留异常处置说明<textarea data-field="followup" class="form-control" maxlength="1000"></textarea></label></div><div class="d-flex justify-content-between align-items-center gap-2 mt-2"><small class="text-secondary" data-item-actor></small><button type="button" data-report class="btn btn-outline-warning btn-sm">上报项目异常</button></div></div></template>
<dialog id="mt-command-dialog" class="problem-dialog" aria-labelledby="mt-command-title"><h2 id="mt-command-title"></h2><form id="mt-command-form"><div id="mt-assignment-fields"><label class="field">主责人员 *<select id="mt-primary" class="form-select"></select></label><span class="small">协作人员（可多选）</span><div id="mt-collaborators" class="d-flex flex-column gap-2 my-2"></div></div><div id="mt-start-fields"><p id="mt-command-safety" class="small"></p><label class="form-check"><input id="mt-confirmed" type="checkbox" class="form-check-input">已核实现场安全条件与许可控制措施</label></div><div id="mt-discovery-fields"><label class="field">异常描述 *<textarea id="mt-description" class="form-control" maxlength="1000"></textarea></label><label class="field">发生时间 *<input id="mt-occurred" type="datetime-local" class="form-control"></label><label class="field">优先级<select id="mt-priority" class="form-select"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></label><label class="field">异常证据引用<input id="mt-evidence" class="form-control" maxlength="1000"></label></div><label id="mt-reason-label" class="field">操作原因 *<textarea id="mt-reason" class="form-control" maxlength="2000"></textarea></label><p id="mt-command-error" role="alert" class="text-danger"></p><div class="actions"><button id="mt-command-cancel" type="button" class="btn btn-outline-secondary btn-sm">取消</button><button id="mt-command-submit" class="btn btn-primary btn-sm">确认</button></div></form></dialog><dialog id="mc-dialog" class="problem-dialog" aria-labelledby="mc-title"><h2 id="mc-title"></h2><p id="mc-context" class="small text-secondary"></p><form id="mc-form"><div id="mc-acceptance-fields"><label class="field">验收决定<select id="mc-acceptance-decision" class="form-select"><option value="passed">通过</option><option value="returned">退回重做</option></select></label><label class="form-check my-2"><input id="mc-items-verified" type="checkbox" class="form-check-input">已逐项核实执行结果与证据</label><label class="form-check my-2"><input id="mc-trial-verified" type="checkbox" class="form-check-input">已独立核实试运行结果</label><label class="field">验收证据引用<input id="mc-acceptance-evidence" class="form-control" maxlength="1000"></label><label class="field">遗留异常评审及后续安排<textarea id="mc-residual-review" class="form-control" maxlength="2000" placeholder="有关联异常时，通过验收必须说明；不会关闭异常或解除限制"></textarea></label></div><div id="mc-termination-fields"><label class="field">已完成工作 *<textarea id="mc-completed-work" class="form-control" maxlength="2000"></textarea></label><label class="field">遗留风险 *<textarea id="mc-residual-risk" class="form-control" maxlength="2000"></textarea></label><label class="field">持续控制措施 *<textarea id="mc-controls" class="form-control" maxlength="2000"></textarea></label><label class="field">后续安排 *<textarea id="mc-followup" class="form-control" maxlength="2000"></textarea></label><div class="row g-2"><label class="col-sm-6 field">后续责任人 *<select id="mc-owner" class="form-select"></select></label><label class="col-sm-6 field">安排期限 *<input id="mc-due" type="date" class="form-control"></label></div><label class="field">申请证据引用 *<input id="mc-termination-evidence" class="form-control" maxlength="1000"></label></div><div id="mc-termination-review-fields"><dl id="mc-request-summary" class="small"></dl><label class="field">终止审核决定<select id="mc-termination-decision" class="form-select"><option value="approved">批准终止</option><option value="rejected">驳回申请</option></select></label><label class="form-check my-2"><input id="mc-termination-confirmed" type="checkbox" class="form-check-input">已核实遗留风险、控制措施、后续责任及期限</label></div><label class="field">意见 / 原因 *<textarea id="mc-reason" required class="form-control" maxlength="2000"></textarea></label><p id="mc-error" role="alert" class="text-danger"></p><div class="actions"><button id="mc-cancel" type="button" class="btn btn-outline-secondary btn-sm">取消</button><button id="mc-submit" class="btn btn-primary btn-sm">确认提交</button></div></form></dialog><dialog id="mc-snapshot-dialog" class="problem-dialog" aria-labelledby="mc-snapshot-title"><h2 id="mc-snapshot-title">历史快照</h2><dl id="mc-snapshot-summary" class="small"></dl><div class="table-wrapper"><table class="data-table"><thead><tr><th>项目</th><th>结论 / 实测值</th><th>原始证据</th><th>处置说明</th><th>记录人</th></tr></thead><tbody id="mc-snapshot-results"></tbody></table></div><div id="mc-snapshot-pagination" class="list-pagination"></div><button id="mc-snapshot-close" class="btn btn-outline-secondary btn-sm">关闭</button></dialog></main></div><div id="mobile-nav"></div><script src="../mock/data.js"></script><script src="../shared/product.js"></script><script src="../shared/maintenance.js"></script><script src="../shared/domain.js"></script><script src="../shared/archive-context.js?v=20261011-mc1"></script><script src="../shared/state.js"></script><script src="../shared/navigation.js?v=20261011-mc1"></script><script src="../shared/page-routes.js?v=20261011-mc1"></script><script src="../shared/page-table-components.js?v=20261011-filter3"></script><script src="../shared/ui.js"></script><script src="../mock/maintenance-data.js"></script><script src="../mock/maintenance-rules.js"></script><script src="../mock/maintenance-closure-rules.js"></script><script src="../mock/maintenance-task-rules.js"></script><script src="../mock/maintenance-task-api.js"></script><script src="../mock/problem-data.js"></script><script src="../mock/work-data.js"></script><script src="../mock/work-rules.js"></script><script src="../mock/problem-api.js?v=20261011-mc1"></script><script src="../mock/maintenance-api.js?v=20261011-mc1"></script><script src="../mock/list-tools-data.js"></script><script src="../scripts/maintenance-closure-ui.js"></script><script src="../scripts/maintenance-task.js"></script></body></html>
