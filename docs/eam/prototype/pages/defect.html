<body data-page="defect" data-layout="detail">

<div class="title"><div><h1>异常上报与缺陷处置</h1><p class="text-secondary small">观察事实 → 受理判断 → 检查/维修/专业处置</p></div></div>
<div class="columns"><section class="card"><h2>现场上报</h2><label class="field" for="observed-at">发现时间 *<input id="observed-at" type="datetime-local" value="2026-10-10T08:00" placeholder=""></label><label class="field" for="part">设备部位<select id="part"><option value="轴承">轴承</option><option value="润滑系统">润滑系统</option><option value="防护罩">防护罩</option></select></label><label class="field" for="severity">异常等级 *<select id="severity"><option value="medium">一般</option><option value="high">重要</option><option value="urgent">紧急风险</option></select></label><label class="field" for="intent">发现人的处理意向<select id="intent"><option value="check">原因不明，希望检查</option><option value="repair">已知故障，希望维修</option></select></label><label class="field" for="description">异常描述 *<textarea id="description" placeholder="描述现象、影响与现场已采取措施"></textarea></label><label class="field" for="evidence-reference">证据引用 / 附件名称 *<input id="evidence-reference" type="text" value="" placeholder="例如：复测记录编号、照片名称"></label><label class="field" for="evidence-files">选择现场证据<input id="evidence-files" type="file" multiple></label><p class="text-secondary" id="attachment-list">单文件≤5MB；本原型只存元数据，不上传文件内容。</p><div class="actions"><button id="save-report-draft">保存上报草稿</button><button id="discard-report-draft">删除草稿</button></div><p id="report-draft-status"></p><button id="submit-report" class="btn btn-primary">上报异常</button><p class="alert alert-warning">紧急风险按现场规程及时处置，通知主管；登记不发送实际启停指令。</p></section><section class="card"><h2>异常队列与受理</h2><div id="report-selector"></div><div id="report-detail"></div><div class="actions"><button id="edit-report">编辑本人未受理报告</button><button id="withdraw-report">撤回本人报告</button></div><dialog id="report-edit-dialog" aria-labelledby="report-edit-title"><h2 id="report-edit-title">补充未受理报告</h2><label class="field">异常描述 *<textarea id="report-edit-description"></textarea></label><label class="field">等级 *<select id="report-edit-severity"><option value="medium">一般</option><option value="high">重要</option></select></label><label class="field">证据引用<input id="report-edit-evidence"></label><label class="field">修改原因 *<input id="report-edit-reason"></label><div class="actions"><button id="report-edit-save">保存修改</button><button id="report-edit-close">取消</button></div></dialog><label class="field" for="assignee">维修执行人员 *<select id="assignee"><option value="P03">王强 / 内部维修</option><option value="P12">外包张工 / 指定维保</option></select></label><label class="field" for="scope">工作范围 / 处理要求 *<textarea id="scope" placeholder=""></textarea></label><div class="actions"><button id="triage-check">受理并生成专项检查</button><button id="dispatch" class="btn btn-primary">确认缺陷并派工</button><button id="triage-professional">转专业评估</button></div><label class="field" for="professional-opinion">专业分流/处置意见<textarea id="professional-opinion" placeholder=""></textarea></label><label class="field" for="professional-evidence">专业处置证据引用<input id="professional-evidence" type="text" value="" placeholder=""></label><button id="professional-close">记录专业处置结论</button><p class="text-secondary">班组长/工程师受理；专业人员记录处置。报告关闭不自动解除使用限制。</p></section></div>
<p class="text-secondary small my-4">设备管理 / 模拟会话数据 / 未接业务后端</p>
