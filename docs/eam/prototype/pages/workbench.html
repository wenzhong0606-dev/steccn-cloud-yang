    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

</head>

<body data-page="workbench" data-layout="workbench">
    <div id="platform-header"></div>
    <div class="shell">
        <aside id="module-nav"></aside>
        <main>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="title" data-component-src="../components/page-header.html" data-component="page-header" data-component-required="true" data-component-scope="page"><template data-fill="head">
                <div>
                    <h1>角色工作台</h1>
                    <p class="text-secondary small">按人员、角色和业务场景聚合</p>
                </div>
            </template></div>
            <div class="alert alert-info" id="role-note"></div>
            <div class="row g-2 mb-3">
                <div class="col-6 col-lg-3"><section class="card metric h-100"><span class="label" id="metric-label-0"></span><strong id="metric-0"></strong><small>按当前身份与设备范围</small></section></div>
                <div class="col-6 col-lg-3"><section class="card metric h-100"><span class="label" id="metric-label-1"></span><strong id="metric-1"></strong><small>按当前身份与设备范围</small></section></div>
                <div class="col-6 col-lg-3"><section class="card metric h-100"><span class="label" id="metric-label-2"></span><strong id="metric-2"></strong><small>按当前身份与设备范围</small></section></div>
                <div class="col-6 col-lg-3"><section class="card metric h-100"><span class="label" id="metric-label-3"></span><strong id="metric-3"></strong><small>按当前身份与设备范围</small></section></div>
            </div>
            <section class="card business-list-panel" data-component-src="../components/list-panel.html" data-component="list-panel" data-component-required="true">
              <template data-fill="head"><h2 class="business-panel-title">我的工作队列</h2><div class="d-flex flex-wrap align-items-center gap-2">
                <div data-component-src="../components/filter-bar.html" data-component="filter-bar" data-component-required="true"><template data-fill="body"><input id="wb-search" class="form-control" placeholder="搜索设备、单号或责任人" aria-label="搜索待办"><select id="wb-group" class="form-select" aria-label="待办类型"><option value="">全部待办</option></select>
                <button id="wb-refresh" type="button" class="btn btn-outline-secondary btn-sm" aria-label="刷新待办">刷新</button></template></div>
              </div></template>
              <template data-fill="body"><div class="table-wrapper"><table class="data-table"><thead><tr><th>业务 / 单号</th><th>设备 / 内容</th><th>责任人</th><th>期限</th><th>当前状态</th><th>操作</th></tr></thead><tbody id="role-queue"></tbody></table></div></template>
              <template data-fill="footer"><div id="wb-pagination" class="pagination-host" data-component-src="../components/pagination.html" data-component="pagination" data-component-required="true"><template data-fill="body"></template></div></template>
            </section>
            <template id="wb-row"><tr><td data-cell="source"></td><td data-cell="title"></td><td data-cell="owner"></td><td data-cell="due"></td><td><span data-cell="status" class="badge text-bg-secondary"></span></td><td><button data-open type="button" class="btn btn-outline-primary btn-sm"></button></td></tr></template>
            <p class="text-secondary small my-4">设备管理 / 模拟会话数据 / 未接业务后端</p>
        </main>
    </div>
