<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保养计划 · 设备管理</title><link rel="stylesheet" href="../shared/style.css?v=20261011-5"></head><body data-page="maintenance-plan"><div id="platform-header"></div><div class="shell"><aside id="module-nav"></aside><main><div class="breadcrumb" id="breadcrumb"></div><div class="title work-heading"><div><h1 id="pm-title">保养计划详情</h1><p class="text-secondary small">时间规则 · 人员范围 · 独立发布审核</p></div></div>

<p id="pm-detail-load" role="status">正在读取…</p><form id="pm-form"><fieldset id="pm-fields"><section class="card mb-3"><div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2"><h2 class="business-panel-title">计划基本信息</h2><span id="pm-state" class="badge text-bg-secondary"></span></div><div class="row g-3"><label class="col-md-6 field">计划名称 *<input id="pm-name" required maxlength="200" class="form-control"></label><label class="col-md-3 field">设备 *<select id="pm-device" class="form-select" required></select></label><label class="col-md-3 field">责任组织 *<input id="pm-org" required class="form-control"></label></div><p id="pm-version" class="text-secondary small mt-2"></p></section>
<section class="card mb-3"><h2 class="business-panel-title mb-3">时间规则</h2><div class="row g-3"><label class="col-sm-4 field">周期单位<select id="pm-cycle" class="form-select"><option value="day">日</option><option value="week">周</option><option value="month">月</option></select></label><label class="col-sm-4 field">间隔 *<input id="pm-interval" type="number" min="1" max="365" required class="form-control"></label><label class="col-sm-4 field">锚点日期 *<input id="pm-anchor" type="date" required class="form-control"></label><label class="col-sm-4 field">窗口提前天数<input id="pm-before" type="number" min="0" required class="form-control"></label><label class="col-sm-4 field">窗口延后天数<input id="pm-after" type="number" min="0" required class="form-control"></label><label class="col-sm-4 field">工厂时区<input value="Asia/Shanghai" readonly class="form-control"></label></div><p class="text-secondary small mt-2">固定锚点计算；月末无对应日期时取当月最后一天；未接入计时/计次触发。</p></section>
<section class="card mb-3"><h2 class="business-panel-title mb-3">人员范围与主责</h2><div class="row g-3"><div class="col-md-6"><span class="form-label">人员 / 岗位（可多选） *</span><div id="pm-bindings" class="d-flex flex-column gap-2"></div></div><div class="col-md-6"><label class="field">主责策略<select id="pm-mode" class="form-select"><option value="assigned">指定主责</option><option value="dispatch">主管派工</option></select></label><label class="field">指定主责<select id="pm-primary" class="form-select"></select></label><div class="row g-2"><label class="col-6 field">范围生效日期 *<input id="pm-valid-from" type="date" required class="form-control"></label><label class="col-6 field">范围失效日期<input id="pm-valid-to" type="date" class="form-control"></label></div><p class="small text-secondary">候选范围不等于任务执行人；主管派工后任务须明确个人才能开工。</p></div></div></section>
<section class="card mb-3"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="business-panel-title">保养项目</h2><button id="pm-add-item" type="button" class="btn btn-outline-primary btn-sm">添加项目</button></div><div id="pm-items" class="d-flex flex-column gap-3"></div></section></fieldset><p id="pm-error" class="text-danger" role="alert"></p><div class="d-flex flex-wrap gap-2 mb-3"><button id="pm-save" type="submit" class="btn btn-primary btn-sm">保存草稿</button><button id="pm-reload" type="button" class="btn btn-outline-secondary btn-sm">重新读取</button><div id="pm-actions" class="d-flex flex-wrap gap-2"></div></div></form>
<section class="card mb-3"><h2 class="business-panel-title mb-3">版本与审核记录</h2><div id="pm-history" class="small"></div></section>
<section class="card mb-3" id="pm-preview-panel"><div class="list-panel-header"><h2 class="business-panel-title">计划窗口预览</h2><div class="list-panel-tools"><div class="input-group input-group-sm"><span class="input-group-text">从</span><input id="pm-from" type="date" aria-label="预览开始日期" class="form-control"><span class="input-group-text">至</span><input id="pm-to" type="date" aria-label="预览结束日期" class="form-control"></div><button id="pm-generate" type="button" class="btn btn-primary btn-sm" hidden>生成选定任务</button><button id="pm-preview" disabled class="btn btn-outline-primary btn-sm">预览窗口</button></div></div><p class="small text-secondary">预览后勾选窗口生成任务；范围不超过366天、100个窗口。</p><p id="pm-preview-load" role="status">请选择已发布计划进行预览</p><div class="table-wrapper"><table class="data-table"><thead><tr><th>选择</th><th>计划日期</th><th>执行窗口</th><th>版本</th><th>结果</th></tr></thead><tbody id="pm-preview-rows"></tbody></table></div><div id="pm-generated-results" class="small my-2" role="status"></div><div id="pm-preview-pagination" class="list-pagination"></div></section>
<dialog id="pm-generate-dialog" class="problem-dialog" aria-labelledby="pm-generate-title"><h2 id="pm-generate-title">生成保养任务</h2><p id="pm-generate-context" class="small"></p><form id="pm-generate-form"><label class="field">生成 / 历史补发原因<textarea id="pm-generate-reason" class="form-control" maxlength="1000" placeholder="历史日期窗口须填写补发理由"></textarea></label><p id="pm-generate-error" class="text-danger" role="alert"></p><div class="actions"><button id="pm-generate-cancel" type="button" class="btn btn-outline-secondary btn-sm">取消</button><button id="pm-generate-submit" class="btn btn-primary btn-sm">确认生成</button></div></form></dialog><dialog id="pm-command-dialog" class="problem-dialog" aria-labelledby="pm-command-title"><h2 id="pm-command-title"></h2><p id="pm-command-context" class="small text-secondary"></p><form id="pm-command-form"><label class="field">意见 / 原因 *<textarea id="pm-reason" required maxlength="2000" class="form-control"></textarea></label><p id="pm-command-error" role="alert" class="text-danger"></p><div class="actions"><button id="pm-command-cancel" type="button" class="btn btn-outline-secondary btn-sm">取消</button><button id="pm-command-submit" class="btn btn-primary btn-sm">确认</button></div></form></dialog>
<template id="pm-item-template"><section class="border rounded p-3"><div class="row g-2"><label class="col-md-6 field">项目名称 *<input data-field="name" required class="form-control"></label><label class="col-md-6 field">部位<input data-field="part" class="form-control"></label><label class="col-md-6 field">方法 *<input data-field="method" required class="form-control"></label><label class="col-md-6 field">标准 *<input data-field="criterion" required class="form-control"></label><label class="col-md-3 field">结果类型<select data-field="resultType" class="form-select"><option value="conclusion">结论</option><option value="number">数值</option></select></label><label class="col-md-3 field">单位<input data-field="unit" class="form-control"></label><label class="col-md-3 field">下限<input data-field="min" type="number" step="any" class="form-control"></label><label class="col-md-3 field">上限<input data-field="max" type="number" step="any" class="form-control"></label></div><div class="d-flex gap-3 align-items-center flex-wrap mt-2"><label><input data-field="required" type="checkbox"> 必填</label><label><input data-field="evidenceRequired" type="checkbox"> 证据必填</label><button data-remove-item type="button" class="btn btn-outline-danger btn-sm">移除项目</button></div></section></template>
<p class="text-secondary small my-3">模拟接口原型 · 已发布计划可选择窗口生成保养任务</p></main></div><div id="mobile-nav"></div><script src="../mock/data.js"></script><script src="../shared/product.js"></script><script src="../shared/maintenance.js"></script><script src="../shared/domain.js"></script><script src="../shared/archive-context.js?v=20261011-mc1"></script><script src="../shared/state.js"></script><script src="../shared/navigation.js?v=20261011-mc1"></script><script src="../shared/page-routes.js?v=20261011-mc1"></script><script src="../shared/page-table-components.js?v=20261011-filter3"></script><script src="../shared/ui.js"></script><script src="../mock/maintenance-data.js"></script><script src="../mock/maintenance-rules.js"></script><script src="../mock/maintenance-closure-rules.js"></script><script src="../mock/maintenance-task-rules.js"></script><script src="../mock/maintenance-task-api.js"></script><script src="../mock/problem-data.js"></script><script src="../mock/work-data.js"></script><script src="../mock/work-rules.js"></script><script src="../mock/problem-api.js?v=20261011-mc1"></script><script src="../mock/maintenance-api.js?v=20261011-mc1"></script><script src="../scripts/maintenance-plan.js?v=20261011-mc1"></script></body></html>
