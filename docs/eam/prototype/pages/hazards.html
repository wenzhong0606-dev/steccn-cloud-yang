<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>隐患协同 · 设备管理</title>
    <link rel="stylesheet" href="../shared/style.css?v=20261011-closure4">
</head>

<body data-page="hazards" data-layout="list">
    <div id="platform-header"></div>
    <div class="shell">
        <aside id="module-nav"></aside>
        <main>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="title work-heading" data-component-src="../components/page-header.html" data-component="page-header" data-component-required="true" data-component-scope="page"><template data-fill="head">
                <div>
                    <h1>隐患协同</h1>
                    <p class="text-secondary small">控制措施 · 整改复查 · 权威协同 · 独立专业放行</p>
                </div>
            </template></div>
            <section class="problem-metrics">
                <div>范围隐患<strong id="hazard-total">—</strong></div>
                <div>未关闭<strong id="hazard-open">—</strong></div>
                <div>待安全复查<strong id="hazard-review">—</strong></div>
                <div>活动使用限制<strong id="hazard-restrictions">—</strong></div>
            </section>
            <section class="card work-list" data-component="list-panel" data-component-src="../components/list-panel.html" data-component-required="true" data-component-scope="page"><template data-fill="head">
                    <h2 class="business-panel-title">隐患清单</h2>
                    <div class="list-panel-tools">
                        <div class="list-search-group" data-component="filter-bar" data-component-src="../components/filter-bar.html" data-component-required="true"><template data-fill="body"><input id="hazard-search" aria-label="搜索隐患编号或现象" placeholder="搜索隐患编号或现象" class="form-control"><button type="button" class="btn btn-sm btn-outline-secondary" data-filter-toggle="list-filter-options" aria-controls="list-filter-options" aria-expanded="false">筛选条件</button></template></div><button type="button" class="btn btn-sm btn-outline-secondary" data-list-tool="import" data-label="导入" aria-label="导入" title="导入">导入</button><button type="button" class="btn btn-sm btn-outline-secondary" data-list-tool="export" data-label="导出权限范围数据" aria-label="导出权限范围数据" title="导出权限范围数据">导出权限范围数据</button><button type="button" class="btn btn-sm btn-outline-secondary" data-list-tool="refresh" data-label="刷新" aria-label="刷新" title="刷新">刷新</button><button type="button" class="btn btn-sm btn-outline-secondary" data-list-tool="columns" data-label="列设置" aria-label="列设置" title="列设置">列设置</button>
                        <div class="actions"><button id="hazard-refresh" type="button">刷新</button><button id="hazard-create" type="button" class="btn btn-sm btn-primary">登记隐患线索</button></div>
                    </div>
                </template><template data-fill="body">

                <div class="filter-options" id="list-filter-options" hidden=""><select id="hazard-authority" aria-label="治理权威来源">
                        <option value="">全部来源</option>
                        <option value="local">EAM治理</option>
                        <option value="EHS">外部权威</option>
                    </select><button id="hazard-clear" type="button">清除筛选</button></div>
                <p id="hazard-load" class="text-secondary" role="status">正在读取…</p>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>隐患 / 范围</th>
                                <th>分类 / 权威</th>
                                <th>治理状态</th>
                                <th>责任人 / 期限</th>
                                <th>使用限制</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="hazard-rows"></tbody>
                    </table>
                </div>
                <div id="hazard-empty" class="empty-state" hidden="">当前筛选暂无隐患</div>

            </template><template data-fill="footer"><div class="pagination-host" data-component-src="../components/pagination.html" data-component-required="true" data-component="pagination"><template data-fill="body"><span id="hazard-count"></span>
                    <div><button id="hazard-prev" type="button">上一页</button><button id="hazard-next" type="button">下一页</button></div>
                </template></div></template></section>
            <dialog id="hazard-detail" class="problem-dialog" aria-labelledby="hazard-detail-title">
                <div class="problem-dialog-heading">
                    <div>
                        <p id="hazard-id" class="text-secondary"></p>
                        <h2 id="hazard-detail-title"></h2>
                    </div><button id="hazard-detail-close" type="button">关闭</button>
                </div>
                <div id="hazard-badges" class="actions"></div>
                <dl id="hazard-facts" class="problem-facts"></dl>
                <h3>控制措施与证据</h3>
                <p id="hazard-controls" class="problem-evidence"></p>
                <p id="hazard-evidence" class="problem-evidence"></p>
                <h3>治理与放行操作</h3>
                <div id="hazard-actions" class="actions"></div>
                <div class="actions"><button id="hazard-work" type="button">创建处置工单</button><button id="hazard-equipment" type="button">设备档案</button></div>
                <p id="hazard-authority-note" class="text-secondary"></p>
                <h3>历史证据与审计</h3>
                <div id="hazard-audit"></div>
            </dialog>
            <dialog id="hazard-command" class="problem-dialog" aria-labelledby="hazard-command-title" data-component-src="../components/dialog-content.html" data-component="dialog" data-component-required="true"><template data-fill="head"><h2 id="hazard-command-title"></h2></template><template data-fill="body">

                <form id="hazard-command-form"><label id="hazard-classification-field" class="field" hidden="">风险核实分类<select id="hazard-classification">
                            <option value="general">一般隐患</option>
                            <option value="major">重大隐患（须权威治理流程）</option>
                        </select></label><label id="hazard-control-field" class="field" hidden="">控制措施 *<textarea id="hazard-control" maxlength="2000"></textarea></label><label id="hazard-control-until-field" class="field" hidden="">控制有效期 *<input id="hazard-control-until" type="datetime-local"></label><label id="hazard-decision-field" class="field" hidden="">复查决定<select id="hazard-decision">
                            <option value="pass">独立复查通过，关闭隐患</option>
                            <option value="return">复查不通过，继续整改</option>
                        </select></label><label id="hazard-receipt-field" class="field" hidden="">预定义权威回执（评审模拟）<select id="hazard-receipt"></select></label><label class="field">操作意见 *<textarea id="hazard-reason" required="" maxlength="2000"></textarea></label><label id="hazard-evidence-field" class="field">证据 / 核实依据 *<textarea id="hazard-command-evidence" maxlength="2000"></textarea></label>
                    <p id="hazard-error" class="problem-error" role="alert"></p>
                    <div class="actions"><button id="hazard-command-cancel" type="button">取消</button><button id="hazard-command-submit" class="btn btn-sm btn-primary" type="submit">确认提交</button></div>
                </form>
            </template></dialog>
            <p class="text-secondary small my-4">模型评审 · JSON异步模拟接口；未接真实业务服务</p>
            <dialog id="list-tools-dialog" aria-labelledby="list-tools-title" data-component-src="../components/dialog-content.html" data-component="dialog" data-component-required="true"><template data-fill="head"><h2 id="list-tools-title"></h2></template><template data-fill="body">

                <div id="list-tools-body"></div>
                <p id="list-tools-status" role="status" class="small text-secondary"></p>
                <div class="actions"><button id="list-tools-close" type="button" class="btn btn-sm btn-outline-secondary">关闭</button><button id="list-tools-confirm" type="button" class="btn btn-sm btn-primary" hidden="">确认</button></div>
            </template></dialog>
        </main>
    </div>
    <div id="mobile-nav"></div>
    <script src="../mock/data.js?v=20261010"></script>
    <script src="../shared/product.js"></script>
    <script src="../shared/maintenance.js"></script>
    <script src="../shared/loader.js?v=20261011-closure4"></script>

    <script src="../shared/form.js?v=20261011-closure4"></script>

    <script src="../shared/components.js?v=20261011-closure4"></script>

    <script src="../shared/domain.js"></script>
    <script src="../shared/archive-context.js?v=20261011-mc1"></script>
    <script src="../shared/state.js?v=20261011-context3"></script>
    <script src="../shared/navigation.js?v=20261011-mc1"></script>
    <script src="../shared/page-routes.js?v=20261011-mc1"></script>
    <script src="../shared/page-table-components.js?v=20261011-closure4"></script>
    <script src="../shared/ui.js?v=20261011-closure4"></script>
    <script src="../mock/problem-data.js"></script>
    <script src="../mock/work-data.js?v=20261011-ap1"></script>
    <script src="../mock/work-rules.js?v=20261011-ap1"></script>
    <script src="../mock/approval-data.js"></script>
    <script src="../mock/problem-api.js?v=20261011-qa1"></script>
    <script src="../scripts/work-ui.js?v=20261011-closure4"></script>
    <script src="../scripts/hazards-page.js?v=20261011-closure4"></script>
    <script src="../mock/list-tools-data.js"></script>
    <script src="../mock/list-tools-api.js"></script>
    <script src="../shared/list-toolbar.js?v=20261011-closure4"></script>


</body></html>
