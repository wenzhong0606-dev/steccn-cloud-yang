<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>点检与专项检查 · 设备管理原型</title>
    <link rel="stylesheet" href="../shared/style.css?v=20261011-closure4">
</head>

<body data-page="inspection" data-layout="detail">
    <div id="platform-header"></div>
    <div class="shell">
        <aside id="module-nav"></aside>
        <main>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="title" data-component-src="../components/page-header.html" data-component="page-header" data-component-required="true" data-component-scope="page"><template data-fill="head">
                <div>
                    <h1>点检与专项检查</h1>
                    <p class="text-secondary small">例行逐项执行 / 临时检查 / 诊断分流</p>
                </div>
            </template></div>
            <div class="tabs"><button data-tab="routine" class="active">例行任务</button><button data-tab="special">专项/临时检查</button></div>
            <section class="card" data-panel="routine" data-component-src="../components/card.html" data-component="card" data-component-required="true"><template data-fill="head"><div class="sectionhead">
                    <h2 id="task-title"></h2><span class="badge rounded-pill text-bg-primary" id="task-status"></span>
                </div></template><template data-fill="body">

                <p id="task-meta" class="text-secondary"></p>
                <div id="task-selector" class="actions"></div>
                <p id="task-method"></p><label class="field" for="temperature">轴承温度（°C） *<input id="temperature" type="number" value="" placeholder="例如65或86"></label><label class="field" for="lubrication">润滑检查
                    *<select id="lubrication">
                        <option value="">请选择</option>
                        <option value="normal">正常</option>
                        <option value="abnormal">异常</option>
                    </select></label><label class="field" for="guard">防护检查 *<select id="guard">
                        <option value="">请选择</option>
                        <option value="normal">正常</option>
                        <option value="abnormal">异常</option>
                    </select></label><label class="field" for="exception">异常说明（异常时必填）<textarea id="exception" placeholder=""></textarea></label><label class="field" for="evidence-reference">证据引用 / 附件名称
                    *<input id="evidence-reference" type="text" value="" placeholder="例如：复测记录编号、照片名称"></label><label class="field" for="evidence-files">选择现场证据<input id="evidence-files" type="file" multiple=""></label>
                <p class="text-secondary" id="attachment-list">单文件≤5MB；本原型只存元数据，不上传文件内容。</p>
                <div class="actions"><button id="discard-inspection-draft">删除本人草稿</button><button id="cancel-task">主管取消任务</button><button id="save-draft">保存草稿</button><button id="submit-inspection" class="btn btn-primary">提交逐项结果</button></div>
                <p class="text-secondary small my-4">执行人 <span id="actor-name"></span> / 对象版本 <span id="object-version"></span>；标准与任务快照固定，超限先登记异常待受理。</p>
                <div id="result-summary"></div>
            </template></section>
            <section class="card" data-panel="special" hidden="" data-component-src="../components/card.html" data-component="card" data-component-required="true"><template data-fill="head"><h2>专项检查队列</h2></template><template data-fill="body">

                <div id="check-selector" class="actions"></div>
                <div id="check-info"></div><label class="field" for="check-conclusion">检查结论 *<select id="check-conclusion">
                        <option value="normal">未发现缺陷</option>
                        <option value="defect">确认缺陷需维修</option>
                        <option value="professional">需专业评估</option>
                    </select></label><label class="field" for="check-opinion">检查说明 *<textarea id="check-opinion" placeholder=""></textarea></label><label class="field" for="check-evidence">专项检查证据引用 *<input id="check-evidence" type="text" value="" placeholder=""></label><button id="cancel-check">主管取消专项检查</button><button id="submit-check" class="btn btn-primary">提交检查结论</button>
                <hr>
                <h3>申请临时检查</h3><label class="field" for="check-reason">检查原因 *<textarea id="check-reason" placeholder=""></textarea></label><label class="field" for="check-method">一次性方法与判定要求 *<textarea id="check-method" placeholder=""></textarea></label><button id="request-check">申请临时检查</button>
                <p class="text-secondary">模拟由主管受理并指派李敏；不要求先建长期计划。</p>
            </template></section>
            <p class="text-secondary small my-4">设备管理 / 模拟会话数据 / 未接业务后端</p>
        </main>
    </div>
    <div id="mobile-nav"></div>

    <script src="../shared/product.js?v=20261010"></script>
    <script src="../shared/maintenance.js?v=20261010"></script>
    <script src="../shared/domain.js?v=20261010"></script>
    <script src="../shared/archive-context.js?v=20261011-mc1"></script>
    <script src="../shared/loader.js?v=20261011-closure4"></script>
  <script src="../shared/state.js?v=20261011-context3"></script>
    <script src="../shared/navigation.js?v=20261011-mc1"></script>
    <script src="../shared/page-routes.js?v=20261011-mc1"></script>
    <script src="../shared/page-table-components.js?v=20261011-closure4"></script>
    <script src="../shared/form.js?v=20261011-closure4"></script>
  <script src="../shared/components.js?v=20261011-closure4"></script>
  <script src="../shared/ui.js?v=20261011-closure4"></script>
    <script src="../shared/interactions.js?v=20261011-closure4"></script>
    <script src="../scripts/inspection.js?v=20261011-closure4"></script>


</body></html>
