<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>点检计划 · 设备管理原型</title>
    <link rel="stylesheet" href="../shared/style.css?v=20261011-closure4">
</head>

<body data-page="plans" data-layout="detail">
    <div id="platform-header"></div>
    <div class="shell">
        <aside id="module-nav"></aside>
        <main>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="title" data-component-src="../components/page-header.html" data-component="page-header" data-component-required="true" data-component-scope="page"><template data-fill="head">
                <div>
                    <h1>点检计划</h1>
                    <p class="text-secondary small">标准定义检查内容，路线定义顺序，计划定义频次、窗口和责任候选范围，任务落实到具体执行人</p>
                </div>
            </template></div>
            <div class="columns">
                <section class="card" data-component-src="../components/card.html" data-component="card" data-component-required="true"><template data-fill="head"><h2>路线与设备项目</h2></template><template data-fill="body">

                    <ol>
                        <li>原料二车间 → 配料线</li>
                        <li>1#混合机 → 轴承温度 → 润滑 → 防护</li>
                    </ol>
                    <p>不同设备/部位可绑定不同标准；本批只演示EQ-001。温度、润滑属于可配置例行组；防护属于固定每周一检查组，本批暂不提供其频次编辑。</p>
                    <p id="plan-info"></p><label class="field" for="route-name">路线名称 *<input id="route-name" type="text" value="原料巡检线" placeholder=""></label><label class="field" for="plan-frequency">例行项目组频次
                        *<select id="plan-frequency">
                            <option value="shift">每班</option>
                            <option value="daily">每日</option>
                            <option value="weekly">每周</option>
                        </select></label><label class="field" for="plan-time">执行窗口开始 *<input id="plan-time" type="time" value="08:00" placeholder=""></label>
                    <fieldset class="assignment-card">
                        <legend>计划责任配置</legend><label class="field">绑定对象 *<select id="plan-binding">
                                <option value="person">指定人员</option>
                                <option value="position">岗位</option>
                                <option value="mixed">岗位与人员组合</option>
                            </select></label>
                        <div id="plan-people-box">
                            <p>指定人员（可多选）</p>
                            <div id="plan-people" class="choice-list"></div>
                        </div>
                        <div id="plan-positions-box">
                            <p>责任岗位（可多选，引用平台岗位与有效在岗成员）</p>
                            <div id="plan-positions" class="choice-list"></div>
                        </div><label class="field">任务分配方式 *<select id="plan-policy">
                                <option value="pool">候选池派工：主管指定一人负责</option>
                                <option value="per_person">逐人执行：每人生成独立任务</option>
                            </select></label>
                        <p id="plan-candidates" class="alert alert-info"></p>
                        <p class="text-secondary">多人/多岗位合并去重。岗位不等于系统权限角色；任务始终只有一位主责任人，协作人员不共用提交责任。岗位空缺、人员失效时阻断生成。</p>
                    </fieldset>
                    <div class="actions"><button id="save-plan">保存计划草稿</button><button id="publish-plan" class="btn btn-primary">审核启用计划</button></div>
                    <p id="plan-draft"></p>
                    <p class="text-secondary">工程师/主管分别起草与批准；标准、计划分别发布。复杂日历、工时触发、多设备路线后续展开。</p>
                </template></section>
                <section class="card" data-component-src="../components/card.html" data-component="card" data-component-required="true"><template data-fill="head"><h2>按计划生成与实例检查</h2></template><template data-fill="body">
                    <label class="field" for="generate-date">业务日期 *<input id="generate-date" type="date" value="2026-10-11" placeholder=""></label><label class="field">本批任务执行人（候选池派工时必选）<select id="task-assignee">
                            <option value="">请选择具体执行人</option>
                        </select></label>
                    <p id="generation-rule" class="text-secondary"></p><button id="generate-tasks" class="btn btn-primary">生成任务（幂等）</button>
                    <div id="generated-tasks"></div>
                    <p class="alert alert-info">新任务引用当前发布标准/计划版本；原任务保留原快照。重复生成不会增加相同实例。</p>
                </template></section>
            </div>
            <section class="card" data-component-src="../components/card.html" data-component="card" data-component-required="true"><template data-fill="head"><h2>版本维护与历史</h2></template><template data-fill="body">

                <div class="actions"><button id="copy-plan">复制为新版本草稿</button><button id="discard-plan">删除本人草稿</button><button id="disable-plan">停用当前版本</button></div>
                <p class="text-secondary">发布记录不删除；修订通过新版本完成。停用阻止新任务生成，已有任务保留快照。</p>
                <div id="plan-history"></div>
            </template></section>
            <p class="text-secondary small my-4">设备管理 / 模拟会话数据 / 未接业务后端</p>
        </main>
    </div>
    <div id="mobile-nav"></div>

    <script src="../shared/components.js?v=20261011-closure4"></script>

    <script src="../shared/domain.js?v=20261010"></script>

    <script src="../shared/state.js?v=20261011-context3"></script>
    <script src="../shared/navigation.js?v=20261011-mc1"></script>
    <script src="../shared/page-routes.js?v=20261011-mc1"></script>
    <script src="../shared/page-table-components.js?v=20261011-closure4"></script>
    <script src="../shared/ui.js?v=20261011-closure4"></script>
    <script src="../shared/interactions.js?v=20261011-closure4"></script>
    <script src="../scripts/plans.js?v=20261011-closure4"></script>


</body></html>
