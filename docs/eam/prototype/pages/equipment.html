<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备台账 · 设备管理原型</title><link rel="stylesheet" href="../shared/style.css?v=20261011-closure4">
</head>
<body data-page="equipment" data-layout="ledger">
<div id="platform-header"></div>
<div class="shell"><aside id="module-nav"></aside><main>
<div class="breadcrumb" id="breadcrumb"></div>
<div class="title" data-component="page-header" data-component-src="../components/page-header.html" data-component-required="true" data-component-scope="page">
  <template data-fill="head"><div><h1>设备台账</h1><p class="text-secondary small">设备树、筛选与全生命周期档案入口</p></div></template>
</div>
<div class="equipment-layout">
<section class="card tree"><div id="ledger-tree-panel"><div class="d-flex align-items-center justify-content-between gap-2 mb-2"><h2 class="mb-0 fs-6 text-nowrap">设备导航</h2><div class="btn-group btn-group-sm" role="group" aria-label="设备树视图"><button type="button" id="tree-location" class="btn btn-primary" aria-pressed="true">位置</button><button type="button" id="tree-asset" class="btn btn-outline-secondary" aria-pressed="false">组成</button></div></div><div class="input-group input-group-sm flex-nowrap mb-2"><input id="tree-search" class="form-control" type="search" placeholder="筛选设备树" aria-label="筛选设备导航"><button id="tree-expand-all" type="button" class="btn btn-outline-secondary px-2 flex-shrink-0" aria-label="全部展开" title="全部展开"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16M9 10l3 3 3-3"></path></svg></button><button id="tree-collapse-all" type="button" class="btn btn-outline-secondary px-2 flex-shrink-0" aria-label="全部折叠" title="全部折叠"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16M9 14l3-3 3 3"></path></svg></button></div><div id="dynamic-tree" class="panel-scroll"></div><p class="tree-footer text-secondary small">位置与资产组成分别维护。</p></div></section>
<section class="card ledger-results" data-component="list-panel" data-component-src="../components/list-panel.html" data-component-required="true" data-component-scope="page">
  <template data-fill="head">
    <h2 class="business-panel-title">设备清单</h2>
    <div class="list-panel-tools">
    <div data-component="filter-bar" data-component-src="../components/filter-bar.html" data-component-required="true">
      <template data-fill="body">
        <input id="search" type="search" class="form-control" placeholder="搜索名称 / 编码 / 位置" aria-label="搜索设备">
        <button id="open-advanced-filter" type="button" class="btn btn-outline-secondary position-relative" aria-haspopup="dialog" title="高级筛选" aria-label="高级筛选"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"></path></svg><span id="filter-badge" class="badge text-bg-primary position-absolute top-0 start-100 translate-middle rounded-pill" hidden="">0</span></button>
      </template>
    </div>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-list-tool="import" data-label="导入" aria-label="导入" title="导入">导入</button><button id="ledger-columns" data-list-tool="columns" data-label="列设置" type="button" class="btn btn-outline-secondary" aria-haspopup="true" aria-expanded="false" title="列设置" aria-label="列设置"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v16M4 8h5M4 16h5M15 4v16M20 8h-5M20 16h-5"></path></svg></button>
    <button id="ledger-refresh" data-list-tool="refresh" data-label="刷新" type="button" class="btn btn-outline-secondary" title="刷新" aria-label="刷新"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"></path></svg></button>
    <button id="ledger-export" data-list-tool="export" data-label="导出权限范围数据" type="button" class="btn btn-outline-secondary" title="导出清单" aria-label="导出清单"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></button>
    <button id="new-equipment" type="button" class="btn btn-primary">新增设备</button>
    </div>
    <div id="column-menu" class="ledger-menu card shadow-sm p-2" hidden="" role="menu" aria-label="列设置">
      <label class="d-flex align-items-center gap-2 mb-1"><input type="checkbox" id="col-criticality" checked=""> 重要等级</label>
      <label class="d-flex align-items-center gap-2 mb-1"><input type="checkbox" id="col-manufacturer" checked=""> 制造商</label>
      <label class="d-flex align-items-center gap-2 mb-0"><input type="checkbox" id="col-commissionedAt" checked=""> 投运日期</label>
    </div>
  </template>
  <template data-fill="body">
    <details id="ledger-metrics-panel" open=""><summary>设备统计概览</summary><div id="ledger-stats" class="row g-3 mb-3" aria-label="设备统计概览"></div></details>
    <div class="table-wrapper table-responsive" tabindex="0" aria-label="设备列表，可在容器内滚动"><table id="equipment-table" class="table table-hover align-middle mb-0"><thead id="ledger-head" class="sticky-top table-light"></thead><tbody id="equipment-list"></tbody></table></div>
    <div id="empty-search" hidden="" class="alert alert-warning">没有匹配设备，请调整筛选或新增设备。</div>
  </template>
  <template data-fill="footer">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">
      <div data-component="pagination" data-component-src="../components/pagination.html" data-component-required="true">
        <template data-fill="body"><span id="equipment-count"></span><div class="d-flex gap-2"><button id="previous-page" class="btn btn-outline-secondary btn-sm">上一页</button><button id="next-page" class="btn btn-outline-secondary btn-sm">下一页</button></div></template>
      </div>
    </div>
  </template>
</section></div>
<dialog id="equipment-dialog" aria-labelledby="equipment-form-title" data-component-src="../components/dialog-content.html" data-component="dialog" data-component-required="true"><template data-fill="head"><h2 id="equipment-form-title">设备资料</h2></template><template data-fill="body"><form id="equipment-form"><div class="form-grid">
<label class="field">设备编码 *<input id="eq-code" required="" maxlength="64" class="form-control form-control-sm"></label><label class="field">设备名称 *<input id="eq-name" required="" maxlength="100" class="form-control form-control-sm"></label><label class="field">型号规格 *<input id="eq-model" required="" maxlength="100" class="form-control form-control-sm"></label><label class="field">所属位置路径 *<input id="eq-location" required="" maxlength="200" placeholder="车间/产线" class="form-control form-control-sm"></label><label class="field">责任人 *<select id="eq-ownerId" class="form-select form-select-sm"><option value="P05">赵工</option><option value="P04">周平</option></select></label><label class="field">关键等级 *<select id="eq-criticality" class="form-select form-select-sm"><option value="normal">一般</option><option value="critical">关键</option></select></label><label class="field">制造商<input id="eq-manufacturer" maxlength="100" class="form-control form-control-sm"></label><label class="field">序列号<input id="eq-serial" maxlength="100" class="form-control form-control-sm"></label><label class="field">投用日期<input id="eq-commissionedAt" type="date" class="form-control form-control-sm"></label><label class="field">资料变更原因 *<input id="eq-reason" required="" maxlength="200" class="form-control form-control-sm"></label></div><p id="equipment-form-status"></p><p id="equipment-form-error" class="text-danger small mt-2" role="alert"></p><div class="actions"><button id="equipment-save" type="submit" class="btn btn-primary">保存草稿/变更</button><button id="equipment-close" type="button" class="btn btn-outline-secondary">关闭</button></div></form></template></dialog>
<dialog id="structure-dialog" aria-labelledby="structure-title" data-component-src="../components/dialog-content.html" data-component="dialog" data-component-required="true"><template data-fill="head"><h2 id="structure-title">设备结构与附件</h2></template><template data-fill="body"><p id="structure-info"></p><h3>设备组成部位</h3><div id="parts-list" class="record-list"></div><form id="part-form"><div class="form-grid"><label class="field">部位编码 *<input id="part-code" required=""></label><label class="field">部位名称 *<input id="part-name" required=""></label><label class="field">父部位<select id="part-parent"></select></label></div><div class="actions"><button id="part-save" type="submit">保存部位</button><button id="part-reset" type="button">新增部位</button></div></form><hr><h3>设备图片、文档与3D文件</h3><p>图片、资料预览、权限下载及生命周期履历统一在设备全景档案中维护。</p><button id="open-device-resources" type="button" class="btn btn-outline-secondary btn-sm">进入设备资料</button><button id="structure-close" type="button" class="btn btn-outline-secondary btn-sm">关闭</button></template></dialog>
<div id="advanced-filter-dialog" class="filter-options" hidden="">
<div class="row g-3">
<label class="field col-6" for="filter-life">生命周期<select id="filter-life" class="form-select form-select-sm"><option value="">全部</option><option value="draft">草稿</option><option value="pending_scrap">待报废</option><option value="active">在用</option><option value="stopped">停用</option><option value="scrapped">已报废</option></select></label>
<label class="field col-6" for="filter-health">健康状态<select id="filter-health" class="form-select form-select-sm"><option value="">全部</option><option value="未知">未知</option><option value="正常">正常</option><option value="待确认">待确认</option><option value="故障">故障</option></select></label>
<label class="field col-6" for="filter-criticality">重要等级<select id="filter-criticality" class="form-select form-select-sm"><option value="">全部</option><option value="critical">关键</option><option value="normal">一般</option></select></label>
<label class="field col-6" for="filter-manufacturer">制造商<select id="filter-manufacturer" class="form-select form-select-sm"><option value="">全部</option></select></label>
</div>
<p class="text-secondary small" id="af-hint">未应用筛选。</p>
<div class="actions"><button id="reset-filter" type="button" class="btn btn-outline-secondary btn-sm">重置</button></div>
</div>
<p class="page-footer text-secondary small">设备管理 / 模拟会话数据 / 未接业务后端</p>
<dialog id="list-tools-dialog" aria-labelledby="list-tools-title" data-component-src="../components/dialog-content.html" data-component="dialog" data-component-required="true"><template data-fill="head"><h2 id="list-tools-title"></h2></template><template data-fill="body"><div id="list-tools-body"></div><p id="list-tools-status" role="status" class="small text-secondary"></p><div class="actions"><button id="list-tools-close" type="button" class="btn btn-sm btn-outline-secondary">关闭</button><button id="list-tools-confirm" type="button" class="btn btn-sm btn-primary" hidden="">确认</button></div></template></dialog></main></div><div id="mobile-nav"></div>

<script src="../mock/list-tools-data.js"></script><script src="../mock/list-tools-api.js"></script><script src="../shared/list-toolbar.js?v=20261011-closure4"></script>
</body></html>
