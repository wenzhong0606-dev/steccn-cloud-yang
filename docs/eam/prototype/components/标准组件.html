<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EAM标准组件样本</title>
    <link rel="stylesheet" href="../shared/style.css?v=20261010-unified2">
</head>

<body>
    <main class="container-fluid p-4 overflow-auto">
        <header class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <div>
                <nav class="small text-body-secondary mb-2">平台 / 模块 / 页面</nav>
                <h1 class="fs-4 mb-1">页面标题</h1>
                <p class="small text-body-secondary mb-0">页面说明插槽</p>
            </div><button class="btn btn-primary btn-sm">主操作</button>
        </header>
        <section class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 class="fs-6 mb-0">业务区标题</h2><span class="small text-body-secondary">结果数插槽</span>
            </div>
            <div class="card-body">
                <div class="d-flex gap-2 flex-wrap mb-3">
                    <div class="input-group input-group-sm"><input class="form-control" aria-label="搜索"
                            placeholder="核心搜索"><button class="btn btn-outline-secondary">高级筛选</button><button
                            class="btn btn-outline-secondary">清空</button></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>主副标题列</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong class="d-block text-nowrap">主标题插槽</strong><small
                                        class="d-block text-body-secondary text-nowrap">副标题插槽</small></td>
                                <td><span class="badge text-bg-secondary">状态插槽</span></td>
                                <td>
                                    <div class="d-flex flex-nowrap gap-1"><button
                                            class="btn btn-link btn-sm">主操作</button><button
                                            class="btn btn-link btn-sm">更多</button></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <footer class="card-footer d-flex justify-content-between align-items-center"><span
                    class="small">分页信息插槽</span>
                <div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary">上一页</button><button
                        class="btn btn-outline-secondary">下一页</button></div>
            </footer>
        </section>
        <p class="small text-body-secondary mt-3">结构样本，无业务数据；复用时按页面记录接入原JSON模拟接口。按钮用于结构展示。</p>
    </main>
</body>

</html>
