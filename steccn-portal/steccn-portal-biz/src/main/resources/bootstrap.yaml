server:
  port: 9300
spring:
  application:
    name: steccn-portal
  cloud:
    nacos:
      discovery:
        server-addr: 10.1.103.235:8848
        namespace: steccn_dev
      config:
        server-addr: 10.1.103.235:8848
        file-extension: yaml
        shared-configs:
          - data-id: application.yaml
            refresh: true
        namespace: steccn_dev

  redis:
    host: ${REDIS_HOST:10.1.103.235}
    port: ${REDIS_PORT:6379}
    database: 15
    jedis:
      pool:
        max-active: 30
        max-idle: 10
        min-idle: 2
        max-wait: 2s
    redisson:
      pool:
        max-active: 30
        max-idle: 10
        min-idle: 2
        max-wait: 2s