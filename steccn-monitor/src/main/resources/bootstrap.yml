server:
  port: 9010

spring:
  application:
    name: steccn-monitor
  cloud:
    nacos:
      discovery:
        server-addr: 10.1.103.235:8848
        namespace: steccn_dev
      config:
        server-addr: 10.1.103.235:8848
        file-extension: yaml
        shared-configs:
          - data-id: application.yaml
            refresh: true
        namespace: steccn_dev

  boot:
    admin:
      client:
        url: http://localhost:9999

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"