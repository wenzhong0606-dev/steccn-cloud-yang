server:
  port: 8989

spring:
  application:
    name: steccn-monitor
  cloud:
    nacos:
      discovery:
        server-addr: 10.1.103.235:8848
        namespace: steccn_dev
      config:
        server-addr: 10.1.103.235:8848
        file-extension: yaml
        shared-configs:
          - data-id: application.yaml
            refresh: true
        namespace: steccn_dev
  security:
    user:
      name: huachun
      password: huachun

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

logging:
  pattern:
    file: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  file:
    name: ./ocpx_logs/hhmt-cpa-ocpx.log