server:
  port: 8989

spring:
  application:
    name: steccn-monitor
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.177:8848
        namespace: 02661da9-6934-416e-b9e8-d1bd0c1b4d1d
      config:
        server-addr: 192.168.1.177:8848
        file-extension: yaml
        shared-configs:
          - data-id: application.yaml
            refresh: true
        namespace: 02661da9-6934-416e-b9e8-d1bd0c1b4d1d
  security:
    user:
      name: huachun
      password: huachun

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

logging:
  pattern:
    file: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  file:
    name: ./ocpx_logs/hhmt-cpa-ocpx.log