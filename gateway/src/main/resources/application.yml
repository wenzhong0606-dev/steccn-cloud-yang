server:
  port: 9000

spring:
  application:
    name: steccn_gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        file-extension: yaml
        server-addr: 127.0.0.1:8848

  security:
    oauth2:
      client:
        registration:
          gatewayclient:
            client-id: steccn-gateway
            client-secret: steccn-gateway
            redirect-uri: http://127.0.0.1:9000/authorized
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope: read

        provider:
          gatewayclient:
            authorization-uri: http://127.0.0.1:9002/oauth2/authorize
            token-uri: http://127.0.0.1:9002/oauth2/token
            jwk-set-uri: http://127.0.0.1:9002/oauth2/jwks
