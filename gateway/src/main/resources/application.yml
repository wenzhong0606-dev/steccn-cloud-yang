server:
  port: 9000

spring:
  application:
    name: steccn_gateway
  cloud:
    loadbalancer:
      cache:
        enabled: true
      caffeine:
        spec: initialCapacity=500,expireAfterWrite=5s
    nacos:
      discovery:
        server-addr: 10.1.103.235:8848
        namespace: steccn_dev
      config:
        file-extension: yaml
        server-addr: 10.1.103.235:8848
    gateway:
      routes:
        - id: user
          uri: lb://user-center
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}

  security:
    oauth2:
      client:
        registration:
          gatewayclient:
            client-id: steccn-gateway
            client-secret: steccn-gateway
            redirect-uri: http://127.0.0.1:9000/authorized
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope: read

        provider:
          gatewayclient:
            authorization-uri: http://127.0.0.1:9002/oauth2/authorize
            token-uri: http://127.0.0.1:9002/oauth2/token
            jwk-set-uri: http://127.0.0.1:9002/oauth2/jwks
  main:
    allow-bean-definition-overriding: true
