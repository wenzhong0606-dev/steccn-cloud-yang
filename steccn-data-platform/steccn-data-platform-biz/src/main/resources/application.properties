spring.mybatis-plus.mapper-locations=classpath:/mapper/*.xml
spring.main.allow-bean-definition-overriding=true
mybatis.configuration.map-underscore-to-camel-case=true
spring.shardingsphere.datasource.names=m1
spring.shardingsphere.datasource.m1.type=com.alibaba.druid.pool.DruidDataSource
spring.shardingsphere.datasource.m1.driver-class-name=org.postgresql.Driver
spring.shardingsphere.datasource.m1.url=jdbc:postgresql://192.168.17.10:5432/gpdb?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=Asia/Shanghai
spring.shardingsphere.datasource.m1.username=gpadmin
spring.shardingsphere.datasource.m1.password=STEC_gpadmin@2022

spring.shardingsphere.sharding.tables.ep_meter_collect.actual-data-nodes=m1.ep_meter_collect_$->{2022..2100}0$->{1..9},m1.ep_meter_collect_$->{2022..2100}1$->{0..2}
spring.shardingsphere.sharding.tables.ep_meter_collect.table-strategy.standard.sharding-column=record_time
spring.shardingsphere.sharding.tables.ep_meter_collect.table-strategy.standard.precise-algorithm-class-name=com.steccn.data.config.TimeShardingAlgorithm
spring.shardingsphere.sharding.tables.ep_meter_collect.table-strategy.standard.range-algorithm-class-name=com.steccn.data.config.TimeShardingAlgorithm
spring.shardingsphere.sharding.tables.ep_meter_collect.key-generator.column=id
spring.shardingsphere.sharding.tables.ep_meter_collect.key-generator.type=SNOWFLAKE

spring.shardingsphere.sharding.tables.pm_station_collect.actual-data-nodes=m1.pm_station_collect_$->{2022..2100}0$->{1..9},m1.pm_station_collect_$->{2022..2100}1$->{0..2}
spring.shardingsphere.sharding.tables.pm_station_collect.table-strategy.standard.sharding-column=record_time
spring.shardingsphere.sharding.tables.pm_station_collect.table-strategy.standard.precise-algorithm-class-name=com.steccn.data.config.TimeShardingAlgorithm
spring.shardingsphere.sharding.tables.pm_station_collect.table-strategy.standard.range-algorithm-class-name=com.steccn.data.config.TimeShardingAlgorithm
spring.shardingsphere.sharding.tables.pm_station_collect.key-generator.column=id
spring.shardingsphere.sharding.tables.pm_station_collect.key-generator.type=SNOWFLAKE

spring.shardingsphere.props.sql.show=false
logging.level.root=error
logging.level.org.springframework.web=error
logging.level.com.steccn.data.dbsharding=error
logging.level.druid.sql=error
